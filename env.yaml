# Machine-specific paths for env.sh.
#
# Flat "key: value" only -- env.sh parses this with shell, not a YAML library,
# because it is the file that decides which Python interpreter exists. No
# nesting, no lists, no multi-line values. Comments and blank lines are fine,
# and a trailing "# ..." on a value line is stripped.
#
# Relative paths resolve against the repo root. A leading ~ expands.
# An environment variable that is already set always wins over this file, so
# a one-off run can override without editing anything:
#
#   TT_PY=/other/python source env.sh
#
# Point elsewhere with SPARSEDRIVE_ENV_YAML=/path/to/other.yaml

devkit_root: ../SparseDriveV2
data_root: dataset
exp_root: exp
map_version: nuplan-maps-v1.0

tt_metal_home: ~/project/tenstorrent/tt-metal
arch_name: wormhole_b0

navsim_py: ~/miniconda3/envs/navsim-sm120/bin/python
tt_py: ~/.tenstorrent-venv/bin/python
